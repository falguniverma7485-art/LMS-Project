<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluation | LMS</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <header>
        <div class="navbar">
            <div class="logo">LMS</div>

            <nav>
                <a href="teacher-dashboard.html">Dashboard</a>
                <a href="teacher-assignments.html">Assignments</a>
                <a href="assignment.html">Student View</a>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>Teacher Evaluation</h1>
            <p>Review the student submission and enter marks and feedback.</p>
        </div>
    </section>

    <div class="submission-card">
        <h2>HTML Assignment</h2>

        <br>

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" value="Gaurav Kumar" readonly>
        </div>

        <div class="form-group">
            <label>Submission</label>
            <input type="text" value="Gaurav_HTML_Assignment.zip" readonly>
        </div>

        <div class="form-group">
            <label>Marks</label>
            <input type="number" min="0" max="10" placeholder="Enter marks">
        </div>

        <div class="form-group">
            <label>Feedback</label>
            <textarea placeholder="Write feedback for the student..."></textarea>
        </div>

        <button type="submit" class="btn">Submit Evaluation</button>
        <a href="student-submissions.html" class="btn btn-secondary">Back to Submissions</a>
    </div>

    <footer>
        <p>LMS Assignment Management System</p>
    </footer>


</body>

</html>
