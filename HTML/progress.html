<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress | LMS</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <header>
        <div class="navbar">
            <div class="logo">LMS</div>

            <nav>
                <a href="assignment.html" class="active">Assignments</a>
                <a href="progress.html">Progress</a>
                <a href="teacher-login.html">Teacher Login</a>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>My Progress</h1>
            <p>Track assignment completion and academic progress.</p>
        </div>
    </section>

    <div class="progress-container">

        <div class="progress-overview">
            <div class="progress-card">
                <h3>Overall Progress</h3>
                <div class="progress-number">75%</div>
            </div>

            <div class="progress-card">
                <h3>Completed</h3>
                <div class="progress-number">6</div>
            </div>

            <div class="progress-card">
                <h3>Pending</h3>
                <div class="progress-number">2</div>
            </div>

            <div class="progress-card">
                <h3>Average Marks</h3>
                <div class="progress-number">8.2</div>
            </div>
        </div>

        <h2 class="section-title">Course Progress</h2>

        <div class="course-progress">
            <div class="course-progress-header">
                <strong>Fullstack Developer</strong>
                <span>90%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" style="width: 90%;"></div>
            </div>
        </div>

        <div class="course-progress">
            <div class="course-progress-header">
                <strong>Database Management</strong>
                <span>70%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" style="width: 70%;"></div>
            </div>
        </div>

        <div class="course-progress">
            <div class="course-progress-header">
                <strong>Computer Networks</strong>
                <span>60%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" style="width: 60%;"></div>
            </div>
        </div>

    </div>

    <footer>
        <p>LMS Assignment Management System</p>
    </footer>


</body>

</html>
